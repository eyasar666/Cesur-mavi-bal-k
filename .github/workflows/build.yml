name: Android derleme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gizli bilgileri kontrol et
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "HATA: KEYSTORE_B64 veya KEYSTORE_PASSWORD gizli bilgisi eksik."
            exit 1
          fi

      - name: Web dosyalarını hazırla
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          cp icon.png resources/icon.png
          cp splash.png resources/splash.png

      - name: Paketleri kur
        run: npm install

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Yatay ekran ve tam ekran ayarı
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i '/name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>' "$S"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "screenOrientation" "$M"
          grep -n "windowFullscreen" "$S"
          grep -n "versionCode" android/app/build.gradle

      - name: İkon ve açılış ekranı üret
        run: npx capacitor-assets generate --android --iconBackgroundColor '#57c6fe' --iconBackgroundColorDark '#57c6fe' --splashBackgroundColor '#57c6fe' --splashBackgroundColorDark '#57c6fe'

      - name: Senkronize et
        run: npx cap sync android

      - name: Uygulama paketini derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: İmzala
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > upload.keystore
          cp android/app/build/outputs/bundle/release/app-release.aab cesur-mavi-balik.aab
          jarsigner -keystore upload.keystore -storepass "$KS_PASS" -keypass "$KS_PASS" -sigalg SHA256withRSA -digestalg SHA-256 cesur-mavi-balik.aab upload
          jarsigner -verify cesur-mavi-balik.aab | head -3
          rm upload.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: cesur-mavi-balik-aab
          path: cesur-mavi-balik.aab

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Derleme ${{ github.run_number }}
          files: cesur-mavi-balik.aab
