<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#06324d;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
#w{height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:10px}
.b{position:fixed;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.22);color:#fff;font:800 14px/1.1 inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none}
.b:focus-visible{outline:3px solid #ffe14d}
.b.off{opacity:.35}
.b.ready{border-color:#ffe14d;animation:pulse 1s infinite}
.pwr{text-shadow:0 1px 3px #0b2a55;border:none;background:radial-gradient(circle,#0a2c56 0 57%,transparent 59%),conic-gradient(var(--c) calc(var(--f,0)*360deg),rgba(255,255,255,.28) 0)}.ic{font-size:30px;line-height:1;display:block}.pwr b{font-size:14px}
#pw{--c:rgba(255,159,28,.95)}#sh{--c:rgba(46,196,255,.95)}.b.on{--c:rgba(76,217,100,.95)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,225,77,.8)}50%{box-shadow:0 0 0 12px rgba(255,225,77,0)}}
@media (prefers-reduced-motion:reduce){.b.ready{animation:none}}
#up,#dn{left:calc(18px + env(safe-area-inset-left,0px));width:62px;height:62px;font-size:26px}
#up{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
